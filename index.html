<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carritos · Montevives</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3352;
    --accent: #4f6ef7;
    --accent2: #7c3aed;
    --text: #e8eaf6;
    --muted: #6b7280;
    --mine: #4f6ef7;
    --other: #374151;
    --free: #1a1d27;
    --danger: #ef4444;
    --success: #10b981;
    --h1: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--h1);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: radial-gradient(ellipse at 60% 20%, #1e2a6e33 0%, transparent 60%),
                radial-gradient(ellipse at 20% 80%, #3b0d6e22 0%, transparent 50%),
                var(--bg);
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 1.25rem;
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 25px 60px #00000060;
  }
  .login-logo {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-bottom: 2rem;
  }
  .login-logo .icon {
    width: 2.4rem;
    height: 2.4rem;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: .6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }
  .login-logo span {
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: -.02em;
  }
  .login-logo small {
    display: block;
    font-size: .7rem;
    color: var(--muted);
    font-weight: 400;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .login-card h2 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: .4rem;
  }
  .login-card p {
    color: var(--muted);
    font-size: .875rem;
    margin-bottom: 1.8rem;
  }
  label {
    display: block;
    font-size: .8rem;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: .4rem;
  }
  input[type=email], input[type=password] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: .6rem;
    padding: .75rem 1rem;
    color: var(--text);
    font-family: var(--h1);
    font-size: .95rem;
    outline: none;
    transition: border-color .2s;
    margin-bottom: 1rem;
  }
  input:focus { border-color: var(--accent); }
  .btn {
    width: 100%;
    padding: .85rem;
    border-radius: .6rem;
    border: none;
    font-family: var(--h1);
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
  }
  .btn-primary:hover { opacity: .9; }
  .btn-danger {
    background: var(--danger);
    color: #fff;
    width: auto;
    padding: .5rem 1rem;
    font-size: .85rem;
  }
  #login-error {
    color: var(--danger);
    font-size: .85rem;
    margin-top: .8rem;
    text-align: center;
    min-height: 1.2rem;
  }

  /* ── APP ── */
  #app-screen { display: none; min-height: 100vh; flex-direction: column; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: .6rem;
  }
  .header-icon {
    width: 2rem;
    height: 2rem;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: .45rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .9rem;
  }
  .header-title { font-weight: 600; font-size: 1rem; }
  .header-user {
    font-size: .75rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: .8rem;
  }
  .user-dot {
    width: .5rem;
    height: .5rem;
    background: var(--success);
    border-radius: 50%;
    display: inline-block;
  }

  main { flex: 1; padding: 1.25rem; max-width: 700px; margin: 0 auto; width: 100%; }

  /* fecha nav */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: .75rem;
    padding: .6rem .75rem;
  }
  .date-nav button {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    font-size: 1.1rem;
    padding: .3rem .6rem;
    border-radius: .4rem;
    transition: background .15s;
  }
  .date-nav button:hover { background: var(--surface2); }
  .date-nav button:disabled { color: var(--muted); cursor: default; }
  #date-label {
    font-size: .95rem;
    font-weight: 500;
    text-align: center;
    flex: 1;
  }
  #date-label small {
    display: block;
    font-size: .7rem;
    color: var(--muted);
    font-weight: 400;
    text-transform: capitalize;
  }

  /* leyenda */
  .legend {
    display: flex;
    gap: 1rem;
    margin-bottom: 1rem;
    font-size: .75rem;
    color: var(--muted);
  }
  .legend-item { display: flex; align-items: center; gap: .4rem; }
  .legend-dot {
    width: .7rem; height: .7rem; border-radius: .2rem;
  }
  .dot-free { background: var(--surface2); border: 1px solid var(--border); }
  .dot-mine { background: var(--accent); }
  .dot-other { background: var(--other); }

  /* grid */
  .grid-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: .75rem;
    overflow: hidden;
  }
  .grid-header {
    display: grid;
    grid-template-columns: 3.5rem repeat(4, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .grid-header div {
    padding: .65rem .5rem;
    text-align: center;
    font-size: .72rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .grid-header div:first-child { border-right: 1px solid var(--border); }

  .grid-row {
    display: grid;
    grid-template-columns: 3.5rem repeat(4, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .grid-row:last-child { border-bottom: none; }
  .hour-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: .5rem .25rem;
    border-right: 1px solid var(--border);
    font-size: .7rem;
    font-weight: 600;
    color: var(--muted);
    font-family: var(--mono);
    line-height: 1.2;
  }
  .hour-label small { font-size: .6rem; font-weight: 400; }

  .cell {
    padding: .4rem .3rem;
    min-height: 3.8rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .15s;
    border-left: 1px solid var(--border);
    text-align: center;
    font-size: .72rem;
    position: relative;
  }
  .cell.free { background: var(--free); }
  .cell.free:hover { background: #1e2540; }
  .cell.mine {
    background: #1a2560;
    border-left-color: var(--accent);
  }
  .cell.mine:hover { background: #1f2d70; }
  .cell.other {
    background: var(--other);
    cursor: default;
  }
  .cell-name {
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
    word-break: break-word;
  }
  .cell.mine .cell-name { color: #a5b4fc; }
  .cell.other .cell-name { color: var(--muted); }
  .cell-tag {
    font-size: .6rem;
    margin-top: .2rem;
    padding: .1rem .35rem;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: .04em;
  }
  .cell.mine .cell-tag { background: var(--accent); color: #fff; }
  .cell.free .cell-tag { background: var(--surface2); color: var(--muted); }

  #loading-overlay {
    position: fixed; inset: 0;
    background: #0f111799;
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .spinner {
    width: 2rem; height: 2rem;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* toast */
  #toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(4rem);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: .75rem;
    padding: .75rem 1.25rem;
    font-size: .875rem;
    font-weight: 500;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    z-index: 200;
    white-space: nowrap;
    box-shadow: 0 8px 30px #00000050;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.ok { border-color: var(--success); color: var(--success); }
  #toast.err { border-color: var(--danger); color: var(--danger); }

  /* weekend */
  .weekend-msg {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
    font-size: .9rem;
  }
  .weekend-msg .big { font-size: 2rem; margin-bottom: .5rem; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="icon">🖥️</div>
      <div>
        <span>Carritos</span>
        <small>IES Montevives</small>
      </div>
    </div>
    <h2>Bienvenido</h2>
    <p>Inicia sesión con tu cuenta de centro</p>
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" placeholder="profesor@montevives.es">
    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="••••••••">
    <button class="btn btn-primary" onclick="login()">Entrar</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <header>
    <div class="header-left">
      <div class="header-icon">🖥️</div>
      <span class="header-title">Carritos · Montevives</span>
    </div>
    <div class="header-user">
      <span class="user-dot"></span>
      <span id="user-label"></span>
      <button class="btn btn-danger" onclick="logout()">Salir</button>
    </div>
  </header>

  <main>
    <div class="date-nav">
      <button id="prev-btn" onclick="changeDay(-1)">&#8592;</button>
      <div id="date-label">
        <span id="date-main"></span>
        <small id="date-sub"></small>
      </div>
      <button id="next-btn" onclick="changeDay(1)">&#8594;</button>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot dot-free"></div> Libre</div>
      <div class="legend-item"><div class="legend-dot dot-mine"></div> Mi reserva</div>
      <div class="legend-item"><div class="legend-dot dot-other"></div> Ocupado</div>
    </div>

    <div id="grid-container"></div>
  </main>
</div>

<div id="loading-overlay" style="display:none"><div class="spinner"></div></div>
<div id="toast"></div>
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:#00000080;z-index:300;align-items:center;justify-content:center;padding:1.5rem;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:1.25rem;padding:2rem;width:100%;max-width:340px;box-shadow:0 25px 60px #00000060;">
    <h3 style="font-size:1.1rem;font-weight:600;margin-bottom:.4rem;">Nueva reserva</h3>
    <p style="font-size:.85rem;color:var(--muted);margin-bottom:1.5rem;">Indica en qué clase estás para que otros profesores puedan localizarte.</p>
    <label for="input-clase">Tu clase</label>
    <input type="text" id="input-clase" placeholder="Ej: 1º DAW A, Sala 12..." style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:.6rem;padding:.75rem 1rem;color:var(--text);font-family:var(--h1);font-size:.95rem;outline:none;margin-bottom:1.25rem;transition:border-color .2s;">
    <div style="display:flex;gap:.75rem;">
      <button onclick="cerrarModal()" style="flex:1;padding:.75rem;border-radius:.6rem;border:1px solid var(--border);background:none;color:var(--text);font-family:var(--h1);font-size:.9rem;cursor:pointer;">Cancelar</button>
      <button onclick="confirmarReserva()" style="flex:1;padding:.75rem;border-radius:.6rem;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:var(--h1);font-size:.9rem;font-weight:600;cursor:pointer;">Reservar</button>
    </div>
  </div>
</div>

<script>
  // ── CONFIGURACIÓN ── Cambia estas dos líneas con tus datos de Supabase
  const SUPABASE_URL = 'https://watfacnytmjzjrdurrrr.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhdGZhY255dG1qempyZHVycnJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NzQ1MDksImV4cCI6MjA5NDE1MDUwOX0.F8VfB0LOlbxXY_hy5ZvuZIALVuuJ3PM-3aZuJnN4oLw';

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

  const HORAS = [
    { num: 1, label: '1ª', time: '08:15-09:15', inicio: [8,15] },
    { num: 2, label: '2ª', time: '09:15-10:15', inicio: [9,15] },
    { num: 3, label: '3ª', time: '10:15-11:15', inicio: [10,15] },
    { num: 4, label: '4ª', time: '11:45-12:45', inicio: [11,45] },
    { num: 5, label: '5ª', time: '12:45-13:45', inicio: [12,45] },
    { num: 6, label: '6ª', time: '13:45-14:45', inicio: [13,45] },
  ];
  const CARRITOS = ['Carrito 1', 'Carrito 2', 'Carrito 3', 'Carrito 4'];
  const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  let currentUser = null;
  let currentDate = new Date();
  let reservas = [];

  // saltar fines de semana al arrancar
  while ([0,6].includes(currentDate.getDay())) {
    currentDate.setDate(currentDate.getDate() + 1);
  }

  // ── AUTH ──
  async function login() {
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('password').value;
    document.getElementById('login-error').textContent = '';
    showLoading(true);
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    showLoading(false);
    if (error) {
      document.getElementById('login-error').textContent = 'Correo o contraseña incorrectos.';
      return;
    }
    currentUser = data.user;
    showApp();
  }

  async function logout() {
    await sb.auth.signOut();
    currentUser = null;
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  }

  async function checkSession() {
    const { data } = await sb.auth.getSession();
    if (data.session) {
      currentUser = data.session.user;
      showApp();
    }
  }

  function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'flex';
    document.getElementById('user-label').textContent = currentUser.email;
    renderDate();
    loadReservas();
  }

  // ── NAVEGACIÓN DE FECHA ──
  function changeDay(delta) {
    currentDate.setDate(currentDate.getDate() + delta);
    // saltar fines de semana
    while ([0,6].includes(currentDate.getDay())) {
      currentDate.setDate(currentDate.getDate() + delta);
    }
    renderDate();
    loadReservas();
  }

  function renderDate() {
    const d = currentDate;
    const hoy = new Date();
    const esHoy = d.toDateString() === hoy.toDateString();
    document.getElementById('date-main').textContent =
      `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
    document.getElementById('date-sub').textContent =
      esHoy ? `${DIAS[d.getDay()]} · hoy` : DIAS[d.getDay()];

    // deshabilitar prev si es hoy
    document.getElementById('prev-btn').disabled = esHoy;
  }

  function dateStr() {
    const d = currentDate;
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${d.getFullYear()}-${mm}-${dd}`;
  }

  // ── DATOS ──
  async function loadReservas() {
    showLoading(true);
    const { data, error } = await sb
      .from('reserva')
      .select('*, profesor(nombre)')
      .eq('fecha', dateStr());
    showLoading(false);
    if (error) { showToast('Error al cargar reservas', 'err'); return; }
    reservas = data || [];
    renderGrid();
  }

  // ── GRID ──
  function renderGrid() {
    const container = document.getElementById('grid-container');

    let html = '<div class="grid-wrap">';
    // cabecera
    html += '<div class="grid-header">';
    html += '<div></div>';
    CARRITOS.forEach(c => { html += `<div>${c}</div>`; });
    html += '</div>';

    // filas por hora
    HORAS.forEach(h => {
      html += '<div class="grid-row">';
      html += `<div class="hour-label">${h.label}<small>${h.time.split('-')[0]}</small></div>`;
      CARRITOS.forEach(c => {
        const reserva = reservas.find(r => r.nombre_carrito === c && r.hora === h.num);
        let cls = 'free', nameHtml = '<span class="cell-tag">Libre</span>';
        if (reserva) {
          const esMia = reserva.email_profesor === currentUser.email;
          cls = esMia ? 'mine' : 'other';
          const nombre = reserva.profesor?.nombre || reserva.email_profesor;
          nameHtml = `<span class="cell-name">${nombre}</span><span class="cell-name" style="font-size:.65rem;opacity:.7">${reserva.clase || ''}</span>`;
          if (esMia) nameHtml += `<span class="cell-tag">Yo</span>`;
        }
        const onclick = reserva
          ? (reserva.email_profesor === currentUser.email ? `cancelar('${reserva.id}', ${h.num})` : '')
          : `reservar('${c}', ${h.num})`;
        html += `<div class="cell ${cls}" ${onclick ? `onclick="${onclick}"` : ''}>${nameHtml}</div>`;
      });
      html += '</div>';
    });

    html += '</div>';
    container.innerHTML = html;
  }

  // ── ACCIONES ──
  let pendienteCarrito = null;
  let pendienteHora = null;

  function reservar(carrito, hora) {
    pendienteCarrito = carrito;
    pendienteHora = hora;
    document.getElementById('input-clase').value = '';
    document.getElementById('input-clase').style.borderColor = '';
    document.getElementById('modal-overlay').style.display = 'flex';
    setTimeout(() => document.getElementById('input-clase').focus(), 100);
  }

  function cerrarModal() {
    document.getElementById('modal-overlay').style.display = 'none';
    pendienteCarrito = null;
    pendienteHora = null;
  }

  async function confirmarReserva() {
    const clase = document.getElementById('input-clase').value.trim();
    if (!clase) { document.getElementById('input-clase').style.borderColor = 'var(--danger)'; return; }
    cerrarModal();
    showLoading(true);
    const { error } = await sb.from('reserva').insert({
      email_profesor: currentUser.email,
      nombre_carrito: pendienteCarrito,
      fecha: dateStr(),
      hora: pendienteHora,
      clase: clase
    });
    showLoading(false);
    if (error) { showToast('No se pudo reservar', 'err'); return; }
    showToast('Reserva realizada ✓', 'ok');
    loadReservas();
  }

  async function cancelar(id, horaNum) {
    const ahora = new Date();
    const horaInfo = HORAS.find(h => h.num === horaNum);
    const inicioReserva = new Date(currentDate);
    inicioReserva.setHours(horaInfo.inicio[0], horaInfo.inicio[1], 0, 0);
    if (inicioReserva - ahora < 60 * 60 * 1000) {
      showToast('No puedes cancelar con menos de 1h de antelación', 'err');
      return;
    }
    if (!confirm('¿Cancelar tu reserva?')) return;
    showLoading(true);
    const { error } = await sb.from('reserva').delete().eq('id', id);
    showLoading(false);
    if (error) { showToast('No se pudo cancelar', 'err'); return; }
    showToast('Reserva cancelada', 'ok');
    loadReservas();
  }

  // ── UI HELPERS ──
  function showLoading(v) {
    document.getElementById('loading-overlay').style.display = v ? 'flex' : 'none';
  }

  let toastTimer;
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = ''; }, 2500);
  }

  // ── ENTER en login ──
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  // ── INIT ──
  checkSession();
</script>
</body>
</html>
